
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CÔNG CỤ Y KHOA</title>

<style>
:root {
  --primary:#087eae;
  --primary-dark:#05658f;
  --primary-light:#e9f5fb;
  --teal:#159b91;
  --bg:#f3f6fa;
  --white:#ffffff;
  --text:#1c2b3a;
  --muted:#718096;
  --border:#e1e8ef;
  --red:#dc4b55;
  --shadow:0 3px 14px rgba(24,54,82,.055);
}
* {box-sizing:border-box}
body {
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button,input,textarea {font:inherit}
button {cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible {
  outline:3px solid #159b9140;
  outline-offset:2px;
}

/* HEADER */
.header {
  height:72px;
  background:var(--white);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  gap:15px;
}
.brand {
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}
.brand-icon {
  width:43px;height:43px;
  border-radius:12px;
  display:grid;place-items:center;
  color:white;
  background:linear-gradient(135deg,#0787bd,#16a49b);
  font-size:23px;font-weight:800;
}
.brand-name {
  font-size:21px;
  font-weight:800;
  letter-spacing:.35px;
  color:#087eae;
}
.brand-subtitle {
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  letter-spacing:.5px;
}
.header-right {
  display:flex;
  align-items:center;
  gap:9px;
}

/* BUTTONS */
.btn {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:9px 14px;
  border-radius:8px;
  border:1px solid var(--border);
  background:white;
  color:var(--text);
  font-size:13px;
  font-weight:650;
  transition:.18s;
}
.btn:hover {background:#f2f7fa;border-color:#b7cbd9}
.btn-primary {
  background:var(--primary);
  border-color:var(--primary);
  color:white;
}
.btn-primary:hover {
  background:var(--primary-dark);
  border-color:var(--primary-dark);
}
.btn-teal {background:var(--teal);color:white;border-color:var(--teal)}
.btn-teal:hover {background:#10867e;color:white}
.btn-danger {background:var(--red);color:white;border-color:var(--red)}
.btn-danger:hover {background:#c63b45;color:white}
.btn-block {width:100%;padding:12px}

/* MAIN */
.main {
  height:calc(100vh - 72px);
  padding:17px 20px 20px;
  display:flex;
  flex-direction:column;
  min-height:0;
}
.page-heading {
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
  min-height:45px;
}
.page-title {
  display:flex;
  align-items:center;
  gap:10px;
  font-size:19px;
  font-weight:750;
  color:#1b3a50;
}
.page-title-icon {
  width:35px;height:35px;
  display:grid;place-items:center;
  background:var(--primary-light);
  border-radius:9px;
  color:var(--primary);
  font-size:18px;
}
.page-caption {
  font-size:12px;
  color:var(--muted);
}

/* WORKSPACE */
.workspace {
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:330px minmax(0,1fr);
  gap:16px;
}
.panel {
  min-height:0;
  background:white;
  border:1px solid var(--border);
  border-radius:12px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.sidebar {
  display:flex;
  flex-direction:column;
}
.sidebar-top {
  padding:16px;
  border-bottom:1px solid var(--border);
}
.sidebar-heading {
  font-size:14px;
  font-weight:750;
  color:#34495b;
  margin-bottom:13px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.count-badge {
  padding:3px 9px;
  background:#eaf4f9;
  color:var(--primary);
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}
.search-wrap {position:relative;margin-top:12px}
.search-icon {
  position:absolute;
  left:12px;top:50%;
  transform:translateY(-50%);
  color:#8494a5;
  font-size:17px;
  pointer-events:none;
}
.search {
  height:42px;
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:0 12px 0 37px;
  outline:none;
  font-size:13px;
  background:#fbfcfe;
}
.search:focus,.field input:focus,.field textarea:focus {
  border-color:var(--primary);
  box-shadow:0 0 0 3px #087eae15;
  background:white;
}
.list-area {flex:1;overflow-y:auto;min-height:0}
.protocol-list {list-style:none;margin:0;padding:7px}
.protocol-item {
  padding:12px;
  border-radius:8px;
  margin-bottom:4px;
  border:1px solid transparent;
  cursor:pointer;
  transition:.15s;
}
.protocol-item:hover {
  background:#f5f9fc;
  border-color:#e4edf3;
}
.protocol-item.active {
  background:#eaf5fa;
  border-color:#c9e3ef;
  border-left:3px solid var(--primary);
}
.protocol-name {
  font-size:13px;
  font-weight:700;
  line-height:1.45;
  overflow-wrap:anywhere;
}
.protocol-meta {
  margin-top:5px;
  color:var(--muted);
  font-size:11px;
}
.list-empty {
  min-height:190px;
  padding:25px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:var(--muted);
}
.list-empty-icon {
  font-size:28px;
  margin-bottom:10px;
  opacity:.7;
}
.list-empty strong {
  font-size:13px;
  color:#536779;
  margin-bottom:5px;
}
.list-empty span {font-size:12px;line-height:1.5}
.sidebar-footer {
  border-top:1px solid var(--border);
  padding:11px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--muted);
  font-size:11px;
}

/* DETAIL PANEL */
.detail {
  display:flex;
  flex-direction:column;
}
.detail-header {
  min-height:62px;
  padding:12px 18px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  background:#fcfdfe;
}
.detail-heading {
  font-size:15px;
  font-weight:750;
  color:#29465a;
  overflow-wrap:anywhere;
}
.detail-actions {
  display:flex;
  flex-wrap:wrap;
  justify-content:flex-end;
  gap:7px;
}
.detail-body {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:23px;
}
.empty-state {
  height:100%;
  min-height:270px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:20px;
}
.empty-art {
  width:75px;height:75px;
  border-radius:22px;
  background:linear-gradient(135deg,#e9f5fb,#e7f7f4);
  display:grid;place-items:center;
  color:var(--primary);
  font-size:34px;
  margin-bottom:17px;
}
.empty-state h3 {
  font-size:17px;
  margin:0 0 8px;
  color:#29465a;
}
.empty-state p {
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  max-width:380px;
}

/* CONTENT */
.content-card {
  border:1px solid var(--border);
  border-radius:10px;
  margin-bottom:18px;
  overflow:hidden;
}
.content-card-heading {
  background:#f6f9fc;
  padding:12px 16px;
  font-size:13px;
  font-weight:750;
  color:#365267;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:8px;
}
.content-card-body {
  padding:17px;
  font-size:14px;
  line-height:1.75;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.note-card {
  background:#fffaf0;
  border:1px solid #f1e3bf;
  border-radius:9px;
  padding:15px;
  margin-top:15px;
}
.note-heading {
  font-size:13px;
  font-weight:750;
  color:#95671a;
  margin-bottom:8px;
}
.note-body {
  white-space:pre-wrap;
  font-size:13px;
  line-height:1.65;
  color:#70551f;
  overflow-wrap:anywhere;
}

/* FORM */
.form-intro {
  font-size:12px;
  color:var(--muted);
  margin:0 0 22px;
  line-height:1.6;
}
.form-wrap {max-width:1050px}
.field {margin-bottom:21px}
.field label {
  display:block;
  font-size:13px;
  font-weight:750;
  color:#34495b;
  margin-bottom:8px;
}
.required {color:var(--red)}
.field input,.field textarea {
  display:block;
  width:100%;
  border:1px solid var(--border);
  border-radius:8px;
  padding:12px 13px;
  outline:none;
  font-size:13px;
  line-height:1.6;
  color:var(--text);
  background:#fbfcfe;
}
.field textarea {
  min-height:280px;
  resize:vertical;
}
.field textarea.note-input {min-height:100px}
.field .hint {
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}
.form-bottom {
  display:flex;
  gap:8px;
  justify-content:flex-end;
  padding-top:6px;
}

/* TOAST */
.toast {
  position:fixed;
  z-index:99;
  right:22px;
  bottom:22px;
  background:#203747;
  color:white;
  border-radius:9px;
  padding:13px 18px;
  box-shadow:0 5px 22px #0002;
  font-size:13px;
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:.2s;
}
.toast.show {opacity:1;transform:translateY(0)}

@media(max-width:760px) {
  body {height:100dvh}
  .header {height:auto;min-height:65px;padding:10px 13px}
  .brand-name {font-size:17px}
  .brand-subtitle {font-size:9px}
  .header-right .btn {padding:8px;font-size:11px}
  .main {height:calc(100dvh - 65px);padding:10px}
  .page-heading {margin-bottom:9px}
  .page-title {font-size:15px}
  .page-caption {display:none}
  .workspace {
    grid-template-columns:1fr;
    grid-template-rows:minmax(180px,35%) minmax(350px,1fr);
    gap:10px;
  }
  .detail-header {align-items:flex-start;flex-direction:column}
  .detail-actions {justify-content:flex-start}
  .detail-body {padding:14px}
  .field textarea {min-height:220px}
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="brand-icon">✚</div>
    <div>
      <div class="brand-name">CÔNG CỤ Y KHOA</div>
      <div class="brand-subtitle">HỖ TRỢ CHUYÊN MÔN VÀ LÂM SÀNG</div>
    </div>
  </div>

  <div class="header-right">
    <button class="btn" id="btnExport" type="button">↓ Xuất dữ liệu</button>
    <button class="btn" id="btnImport" type="button">↑ Nhập dữ liệu</button>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </div>
</header>

<main class="main">
  <div class="page-heading">
    <div class="page-title">
      <div class="page-title-icon">▤</div>
      Protocol phẫu thuật, thủ thuật
    </div>
    <div class="page-caption">QUẢN LÝ VÀ TRA CỨU PROTOCOL CHUYÊN MÔN</div>
  </div>

  <div class="workspace">

    <aside class="panel sidebar">
      <div class="sidebar-top">
        <div class="sidebar-heading">
          <span>DANH SÁCH PROTOCOL</span>
          <span class="count-badge" id="countBadge">0</span>
        </div>

        <button class="btn btn-primary btn-block" id="btnNew" type="button">
          ＋ &nbsp;Nhập protocol mới
        </button>

        <div class="search-wrap">
          <span class="search-icon">⌕</span>
          <input class="search" id="txtSearch" type="search"
            placeholder="Tìm tên phẫu thuật, thủ thuật..." autocomplete="off">
        </div>
      </div>

      <div class="list-area">
        <ul class="protocol-list" id="protocolList"></ul>
      </div>

      <div class="sidebar-footer">
        <span>Tổng số protocol</span>
        <strong id="countLabel">0</strong>
      </div>
    </aside>

    <section class="panel detail" id="detailPanel"></section>

  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

const STORE_KEY = "cong_cu_y_khoa_protocols_vi_v3";

let protocols = [];
let selectedId = null;
let toastTimer;

const $ = id => document.getElementById(id);

function makeId() {
  return "p_" + Date.now().toString(36) + "_" +
    Math.random().toString(36).slice(2,8);
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function notify(message) {
  const el = $("toast");
  el.textContent = message;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"),2600);
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    const data = raw ? JSON.parse(raw) : [];

    protocols = Array.isArray(data) ? data.map((item,index) => ({
      id:String(item.id || ("old_" + index + "_" + Date.now())),
      title:String(item.title || item.name || ""),
      content:String(item.content || ""),
      note:String(item.note || ""),
      time:String(item.time || "")
    })) : [];

  } catch(error) {
    protocols = [];
    notify("Không thể đọc dữ liệu đã lưu.");
  }
}

function saveData() {
  try {
    localStorage.setItem(STORE_KEY,JSON.stringify(protocols));
    return true;
  } catch(error) {
    notify("Lưu thất bại. Vui lòng kiểm tra bộ nhớ trình duyệt.");
    return false;
  }
}

function renderList() {
  const list = $("protocolList");
  const keyword = $("txtSearch").value.trim().toLocaleLowerCase("vi");

  const filtered = protocols.filter(item =>
    item.title.toLocaleLowerCase("vi").includes(keyword)
  );

  list.innerHTML = "";

  if(filtered.length === 0) {
    const li = document.createElement("li");
    li.className = "list-empty";

    if(protocols.length === 0) {
      li.innerHTML =
        '<div class="list-empty-icon">▤</div>' +
        '<strong>Chưa có protocol</strong>' +
        '<span>Nhấn nút “Nhập protocol mới” để thêm nội dung đầu tiên.</span>';
    } else {
      li.innerHTML =
        '<div class="list-empty-icon">⌕</div>' +
        '<strong>Không tìm thấy kết quả</strong>' +
        '<span>Vui lòng thử từ khóa khác.</span>';
    }

    list.appendChild(li);

  } else {
    filtered.forEach(item => {
      const li = document.createElement("li");
      li.className = "protocol-item" +
        (item.id === selectedId ? " active" : "");

      li.tabIndex = 0;
      li.setAttribute("role","button");
      li.innerHTML =
        '<div class="protocol-name">' + escapeHTML(item.title) + '</div>' +
        '<div class="protocol-meta">' +
        (item.note ? "Có ghi chú" : "Protocol chuyên môn") +
        '</div>';

      li.addEventListener("click",() => showProtocol(item.id));
      li.addEventListener("keydown",event => {
        if(event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          showProtocol(item.id);
        }
      });

      list.appendChild(li);
    });
  }

  $("countBadge").textContent = protocols.length;
  $("countLabel").textContent = protocols.length;
}

function renderEmpty() {
  const panel = $("detailPanel");
  panel.innerHTML =
    '<div class="empty-state">' +
      '<div class="empty-art">▤</div>' +
      '<h3>Không gian tra cứu protocol</h3>' +
      '<p>Chọn một phẫu thuật, thủ thuật trong danh sách bên trái để xem nội dung hoặc nhấn “Nhập protocol mới” để bắt đầu xây dựng thư viện chuyên môn.</p>' +
    '</div>';
}

function showProtocol(id) {
  const item = protocols.find(p => p.id === id);

  if(!item) {
    selectedId = null;
    renderList();
    renderEmpty();
    return;
  }

  selectedId = id;
  renderList();

  const panel = $("detailPanel");

  panel.innerHTML =
    '<div class="detail-header">' +
      '<div class="detail-heading">' + escapeHTML(item.title) + '</div>' +
      '<div class="detail-actions">' +
        '<button class="btn" id="btnEdit" type="button">✎ Chỉnh sửa</button>' +
        '<button class="btn" id="btnCopy" type="button">▣ Sao chép</button>' +
        '<button class="btn btn-danger" id="btnDelete" type="button">⌫ Xóa</button>' +
      '</div>' +
    '</div>' +

    '<div class="detail-body">' +
      '<div class="content-card">' +
        '<div class="content-card-heading">▤ &nbsp;NỘI DUNG PROTOCOL</div>' +
        '<div class="content-card-body">' + escapeHTML(item.content) + '</div>' +
      '</div>' +

      (item.note
        ? '<div class="note-card">' +
            '<div class="note-heading">✎ &nbsp;GHI CHÚ</div>' +
            '<div class="note-body">' + escapeHTML(item.note) + '</div>' +
          '</div>'
        : '') +

      '<div style="font-size:11px;color:#8292a1;margin-top:20px">' +
        (item.time ? "Cập nhật gần nhất: " + escapeHTML(item.time) : "") +
      '</div>' +
    '</div>';

  $("btnEdit").addEventListener("click",() => openForm(id));
  $("btnCopy").addEventListener("click",() => copyProtocol(id));
  $("btnDelete").addEventListener("click",() => deleteProtocol(id));
}

function openForm(editId = null) {
  const existing = editId
    ? protocols.find(p => p.id === editId)
    : null;

  const current = existing || {title:"",content:"",note:""};

  const panel = $("detailPanel");

  panel.innerHTML =
    '<div class="detail-header">' +
      '<div class="detail-heading">' +
        (existing ? "Chỉnh sửa protocol" : "Nhập protocol mới") +
      '</div>' +
      '<div class="detail-actions">' +
        '<button class="btn" id="btnCancel" type="button">Hủy</button>' +
        '<button class="btn btn-teal" id="btnSave" type="button">✓ Lưu protocol</button>' +
      '</div>' +
    '</div>' +

    '<div class="detail-body">' +
      '<div class="form-wrap">' +
        '<p class="form-intro">Vui lòng nhập thông tin protocol. Các trường có dấu <span class="required">*</span> là bắt buộc.</p>' +

        '<div class="field">' +
          '<label for="fieldTitle">Tên phẫu thuật, thủ thuật <span class="required">*</span></label>' +
          '<input id="fieldTitle" maxlength="250" type="text" ' +
            'placeholder="Nhập tên phẫu thuật hoặc thủ thuật..." ' +
            'value="' + escapeHTML(current.title) + '">' +
        '</div>' +

        '<div class="field">' +
          '<label for="fieldContent">Nội dung protocol <span class="required">*</span></label>' +
          '<textarea id="fieldContent" placeholder="Nhập nội dung chi tiết của protocol...">' +
            escapeHTML(current.content) +
          '</textarea>' +
          '<span class="hint">Có thể trình bày theo từng bước, đánh số hoặc xuống dòng để dễ tra cứu.</span>' +
        '</div>' +

        '<div class="field">' +
          '<label for="fieldNote">Ghi chú</label>' +
          '<textarea class="note-input" id="fieldNote" placeholder="Nhập ghi chú bổ sung nếu có...">' +
            escapeHTML(current.note) +
          '</textarea>' +
        '</div>' +

        '<div class="form-bottom">' +
          '<button class="btn" id="btnCancelBottom" type="button">Hủy bỏ</button>' +
          '<button class="btn btn-teal" id="btnSaveBottom" type="button">✓ Lưu protocol</button>' +
        '</div>' +
      '</div>' +
    '</div>';

  $("fieldTitle").focus();

  function cancel() {
    if(existing) {
      showProtocol(existing.id);
    } else if(selectedId && protocols.some(p => p.id === selectedId)) {
      showProtocol(selectedId);
    } else {
      renderEmpty();
    }
  }

  function save() {
    const title = $("fieldTitle").value.trim();
    const content = $("fieldContent").value.trim();
    const note = $("fieldNote").value.trim();

    if(!title) {
      notify("Vui lòng nhập tên phẫu thuật, thủ thuật.");
      $("fieldTitle").focus();
      return;
    }

    if(!content) {
      notify("Vui lòng nhập nội dung protocol.");
      $("fieldContent").focus();
      return;
    }

    const now = new Date().toLocaleString("vi-VN");

    if(existing) {
      existing.title = title;
      existing.content = content;
      existing.note = note;
      existing.time = now;
      selectedId = existing.id;
    } else {
      const item = {
        id:makeId(),
        title,
        content,
        note,
        time:now
      };
      protocols.unshift(item);
      selectedId = item.id;
    }

    if(saveData()) {
      renderList();
      showProtocol(selectedId);
      notify(existing ? "Đã cập nhật protocol." : "Đã lưu protocol mới.");
    }
  }

  $("btnCancel").addEventListener("click",cancel);
  $("btnCancelBottom").addEventListener("click",cancel);
  $("btnSave").addEventListener("click",save);
  $("btnSaveBottom").addEventListener("click",save);
}

function copyProtocol(id) {
  const original = protocols.find(p => p.id === id);
  if(!original) return;

  const copy = {
    id:makeId(),
    title:original.title + " (Bản sao)",
    content:original.content,
    note:original.note,
    time:new Date().toLocaleString("vi-VN")
  };

  protocols.unshift(copy);

  if(saveData()) {
    selectedId = copy.id;
    renderList();
    showProtocol(copy.id);
    notify("Đã sao chép protocol.");
  }
}

function deleteProtocol(id) {
  const item = protocols.find(p => p.id === id);
  if(!item) return;

  if(!confirm('Bạn có chắc chắn muốn xóa "' + item.title + '" không?')) return;

  protocols = protocols.filter(p => p.id !== id);
  selectedId = protocols.length ? protocols[0].id : null;

  if(saveData()) {
    renderList();

    if(selectedId) showProtocol(selectedId);
    else renderEmpty();

    notify("Đã xóa protocol.");
  }
}

function exportData() {
  const blob = new Blob(
    [JSON.stringify(protocols,null,2)],
    {type:"application/json;charset=utf-8"}
  );

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "Du-lieu-Protocol-Y-khoa-" +
    new Date().toISOString().slice(0,10) + ".json";

  document.body.appendChild(a);
  a.click();
  a.remove();

  setTimeout(() => URL.revokeObjectURL(url),1000);
  notify("Đã xuất dữ liệu sao lưu.");
}

function importData(file) {
  if(!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result || ""));

      if(!Array.isArray(data)) throw new Error("Invalid format");

      const cleaned = data.map((item,index) => ({
        id:String(item.id || ("import_" + index + "_" + Date.now())),
        title:String(item.title || item.name || ""),
        content:String(item.content || ""),
        note:String(item.note || ""),
        time:String(item.time || new Date().toLocaleString("vi-VN"))
      })).filter(item => item.title && item.content);

      if(!confirm(
        "Tìm thấy " + cleaned.length +
        " protocol hợp lệ. Dữ liệu hiện tại sẽ được thay thế. Bạn có muốn tiếp tục?"
      )) return;

      protocols = cleaned;
      selectedId = protocols.length ? protocols[0].id : null;

      if(saveData()) {
        renderList();
        if(selectedId) showProtocol(selectedId);
        else renderEmpty();
        notify("Đã nhập dữ liệu thành công.");
      }

    } catch(error) {
      notify("File không hợp lệ. Vui lòng chọn file JSON đã xuất từ công cụ.");

    } finally {
      $("fileInput").value = "";
    }
  };

  reader.onerror = () => notify("Không thể đọc file.");
  reader.readAsText(file,"UTF-8");
}

// EVENTS
$("btnNew").addEventListener("click",() => openForm());
$("txtSearch").addEventListener("input",renderList);
$("btnExport").addEventListener("click",exportData);
$("btnImport").addEventListener("click",() => $("fileInput").click());
$("fileInput").addEventListener("change",e => importData(e.target.files[0]));

// INITIALIZE
loadData();
renderList();

if(protocols.length) {
  showProtocol(protocols[0].id);
} else {
  renderEmpty();
}

})();
</script>
</body>
</html>
