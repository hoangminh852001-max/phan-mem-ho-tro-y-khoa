
<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CÔNG CỤ Y KHOA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#087fbd;--ink:#19334b;--muted:#708398;--line:#dce6ef;--bg:#f2f6fa;--soft:#eaf6fc;--red:#c94343}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
header{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:12px}
.brand{font-size:23px;font-weight:800;color:var(--blue)}
.actions,.btnrow{display:flex;gap:8px;flex-wrap:wrap}
button.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:10px 14px;border-radius:10px;font-weight:600}
button.btn:hover{border-color:#91c8e2;background:#f7fbfd}
button.primary{background:var(--blue);color:white;border-color:var(--blue)}
button.primary:hover{background:#066b9e}
button.danger{color:var(--red)}
nav{height:56px;background:white;border-bottom:1px solid var(--line);display:flex;padding:0 24px;gap:8px}
.tab{border:0;background:none;padding:0 16px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
.tab.active{color:var(--blue);border-color:var(--blue)}
main{padding:18px 22px;max-width:1800px;margin:auto}
.workspace{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;min-height:calc(100vh - 170px)}
.sidebar,.panel,.reserve{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0;box-shadow:0 6px 22px #18334b0c}
.sidebar{display:flex;flex-direction:column;min-height:560px}
.sidehead{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:9px}
.search,.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;outline:none;color:var(--ink)}
input:focus,textarea:focus{border-color:#76bddd;box-shadow:0 0 0 3px #087fbd18}
.flabel{font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--muted);padding:15px 15px 6px}
.folders{padding:0 8px 9px;display:grid;gap:3px}
.folder{border:0;background:none;text-align:left;padding:10px;border-radius:9px;display:flex;justify-content:space-between;font-weight:600;color:var(--ink)}
.folder.active{background:var(--soft);color:var(--blue)}
.count{font-size:12px;background:#e8eef4;border-radius:20px;padding:3px 8px}
.folder.active .count{background:#cceafa}
.list{border-top:1px solid var(--line);padding:7px;overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;border:0;background:white;padding:10px;border-radius:8px;color:var(--ink)}
.item:hover,.item.active{background:var(--soft);color:var(--blue)}
.item b{display:block;font-size:13px}
.item small{display:block;color:#8393a3;margin-top:4px}
.empty{padding:20px 8px;text-align:center;color:#8796a5;font-size:13px}
.foot{border-top:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--muted)}
.panel{display:flex;flex-direction:column;min-height:560px}
.panelhead{padding:15px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.panelhead h2{font-size:17px;margin:0}
.body{padding:20px;flex:1;min-width:0}
.welcome{height:100%;min-height:440px;display:grid;place-items:center;text-align:center;color:var(--muted)}
.welcome .emoji{font-size:44px}
.welcome h2{color:var(--ink);font-size:20px;margin:10px 0}
.form{display:grid;gap:16px}
.field label{display:block;font-weight:700;font-size:14px;margin-bottom:7px}
.req{color:var(--red)}
.field textarea{resize:vertical;min-height:220px;line-height:1.65}
.field textarea.notes{min-height:85px}
.dropdown{position:relative}
.dropbtn{width:100%;text-align:left;display:flex;justify-content:space-between;border:1px solid var(--line);border-radius:10px;background:white;padding:12px;color:var(--ink)}
.dropmenu{display:none;position:absolute;z-index:10;top:calc(100% + 5px);left:0;right:0;background:white;border:1px solid var(--line);border-radius:11px;padding:7px;box-shadow:0 12px 28px #14324b24}
.dropdown.open .dropmenu{display:block}
.option{display:flex;gap:9px;align-items:center;padding:9px;border-radius:8px;font-size:13px}
.option:hover{background:#f2f8fc}
.option input{accent-color:var(--blue)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{background:var(--soft);color:#086b9f;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:700}
.upload{border:2px dashed #b8d5e5;border-radius:12px;background:#f8fcfe;padding:20px;text-align:center}
.upload.drag{background:var(--soft);border-color:var(--blue)}
.upload p{font-size:13px;color:var(--muted);margin:5px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:11px}
.thumb{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;right:5px;top:5px;border:0;border-radius:50%;background:#172b40cc;color:white;width:25px;height:25px}
.formfoot{display:flex;justify-content:flex-end;gap:8px}
.detailtitle{font-size:22px;margin:0 0 12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.content{white-space:pre-wrap;line-height:1.75;font-size:14px;overflow-wrap:anywhere}
.section{margin-top:20px}
.section h3{font-size:13px;margin:0 0 8px}
.detailimgs{display:grid;grid-template-columns:repeat(4,minmax(0,180px));gap:10px}
.detailimgs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid var(--line);cursor:zoom-in}
.reserve{min-height:560px;display:flex;flex-direction:column}
.reservecontent{flex:1;display:grid;place-items:center;text-align:center;padding:25px;color:var(--muted)}
.reservecontent .emoji{font-size:48px}
.reservecontent h2{color:var(--ink)}
.toast{position:fixed;bottom:20px;right:20px;background:#19334b;color:white;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:50;font-size:13px}
.toast.show{opacity:1;transform:none}
.modalbg,.lightbox{display:none;position:fixed;inset:0;background:#10223580;z-index:80;align-items:center;justify-content:center;padding:20px}
.modalbg.show,.lightbox.show{display:flex}
.modal{background:white;padding:22px;border-radius:14px;max-width:420px;width:100%}
.modal p{color:var(--muted);font-size:13px}
.modalfoot{display:flex;justify-content:flex-end;gap:8px}
.lightbox{background:#000d}
.lightbox img{max-width:95vw;max-height:90vh}
.lightbox button{position:absolute;right:20px;top:15px;border:0;border-radius:50%;width:38px;height:38px;font-size:22px}
[hidden]{display:none!important}
@media(max-width:850px){
header{padding:12px;height:auto;flex-wrap:wrap}
.brand{font-size:19px}
nav{padding:0 7px}
.tab{padding:0 9px;font-size:12px}
main{padding:12px}
.workspace{grid-template-columns:1fr}
.sidebar{min-height:0}
.list{max-height:220px}
.panel{min-height:480px}
.thumbs{grid-template-columns:repeat(2,minmax(0,1fr))}
.detailimgs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
</style>
</head>
<body>
<header>
<div class="brand">✦ CÔNG CỤ Y KHOA</div>
<div class="actions">
<button class="btn" id="export">Xuất dữ liệu</button>
<button class="btn" id="import">Nhập dữ liệu</button>
<input id="importFile" type="file" accept=".json,application/json" hidden>
</div>
</header>
<nav>
<button class="tab active" data-tab="protocol">Protocol phẫu thuật, thủ thuật</button>
<button class="tab" data-tab="reserve">Công cụ hỗ trợ 2 (Dự phòng)</button>
</nav>
<main>
<section class="workspace" id="protocolTab">
<aside class="sidebar">
<div class="sidehead">
<button class="btn primary" id="new">＋ Nhập protocol mới</button>
<input class="search" id="search" placeholder="Tìm tên phẫu thuật, thủ thuật...">
</div>
<div class="flabel">THƯ MỤC PHÂN LOẠI</div>
<div class="folders" id="folders"></div>
<div class="list" id="list"></div>
<div class="foot" id="total">0 protocol</div>
</aside>
<section class="panel">
<div class="panelhead">
<h2 id="heading">Kho protocol</h2>
<div class="btnrow" id="detailActions" hidden>
<button class="btn" id="edit">Chỉnh sửa</button>
<button class="btn" id="copy">Sao chép</button>
<button class="btn danger" id="delete">Xóa protocol</button>
</div>
</div>
<div class="body" id="body">
<div class="welcome"><div><div class="emoji">📋</div><h2>Chưa có protocol được chọn</h2><p>Chọn protocol ở danh sách bên trái hoặc nhập protocol mới.</p></div></div>
</div>
</section>
</section>
<section class="reserve" id="reserveTab" hidden>
<div class="panelhead"><h2>Công cụ hỗ trợ 2 (Dự phòng)</h2></div>
<div class="reservecontent"><div><div class="emoji">🛠️</div><h2>Khu vực dự phòng</h2><p>Có thể bổ sung các công cụ y khoa khác tại đây trong tương lai.</p></div></div>
</section>
</main>
<div class="toast" id="toast"></div>
<div class="modalbg" id="modal">
<div class="modal">
<h3 id="modalTitle">Xác nhận</h3>
<p id="modalText"></p>
<div class="modalfoot">
<button class="btn" id="cancelModal">Hủy</button>
<button class="btn danger" id="confirmModal">Xác nhận</button>
</div>
</div>
</div>
<div class="lightbox" id="lightbox">
<button id="closeLightbox">×</button>
<img id="lightboxImg" alt="Ảnh protocol">
</div>

<script>
(()=>{
"use strict";

const KEY="cong_cu_y_khoa_protocols_vi_v3";
const CATS=["Chi trên","Chi dưới","Ngoại Tổng hợp","Phẫu thuật khác","Thủ thuật khác"];
const FOLDERS=["Tất cả",...CATS];
const $=id=>document.getElementById(id);

let data=[],activeId=null,folder="Tất cả",editingId=null,images=[],modalAction=null,timer;

const uid=()=>"p_"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));

function toast(s){
$("toast").textContent=s;
$("toast").classList.add("show");
clearTimeout(timer);
timer=setTimeout(()=>$("toast").classList.remove("show"),2600);
}

function normalize(x){
if(!x||typeof x!=="object")return null;
let c=x.categories??x.category??x.groups??[];
if(typeof c==="string")c=[c];
if(!Array.isArray(c))c=[];
let pics=x.images??x.photos??[];
if(!Array.isArray(pics))pics=[];
return{
id:String(x.id??uid()),
name:String(x.name??x.title??x.ten??""),
categories:c.filter(v=>CATS.includes(v)),
content:String(x.content??x.protocol??x.noiDung??""),
notes:String(x.notes??x.note??x.ghiChu??""),
images:pics.slice(0,4).map(v=>typeof v==="string"?v:(v?.dataUrl??v?.src??"")).filter(Boolean),
createdAt:x.createdAt??Date.now(),
updatedAt:x.updatedAt??Date.now()
};
}

function save(){
try{
localStorage.setItem(KEY,JSON.stringify(data));
return true;
}catch(e){
toast("Không đủ dung lượng lưu ảnh. Hãy giảm kích thước ảnh.");
return false;
}
}

function load(){
try{
let a=JSON.parse(localStorage.getItem(KEY)||"[]");
if(!Array.isArray(a))a=a.dataList||[];
data=a.map(normalize).filter(Boolean);
}catch(e){data=[];}
}

function showTab(t){
$("protocolTab").hidden=t!=="protocol";
$("reserveTab").hidden=t!=="reserve";
document.querySelectorAll(".tab").forEach(b=>
b.classList.toggle("active",b.dataset.tab===t)
);
}

document.querySelectorAll(".tab").forEach(b=>{
b.onclick=()=>showTab(b.dataset.tab);
});

function renderFolders(){
$("folders").innerHTML=FOLDERS.map(f=>`
<button class="folder ${folder===f?"active":""}" data-folder="${esc(f)}">
<span>${f==="Tất cả"?"▦　":"📁　"}${esc(f)}</span>
<span class="count">${f==="Tất cả"?data.length:data.filter(p=>p.categories.includes(f)).length}</span>
</button>
`).join("");

$("folders").querySelectorAll("[data-folder]").forEach(b=>{
b.onclick=()=>{
folder=b.dataset.folder;
activeId=null;
$("heading").textContent=folder==="Tất cả"?"Kho protocol":folder;
render();
showWelcome();
};
});
}

function filtered(){
let q=$("search").value.trim().toLocaleLowerCase("vi");
return data.filter(p=>
(folder==="Tất cả"||p.categories.includes(folder))&&
(!q||p.name.toLocaleLowerCase("vi").includes(q)||p.content.toLocaleLowerCase("vi").includes(q))
).sort((a,b)=>a.name.localeCompare(b.name,"vi"));
}

function renderList(){
let a=filtered();

$("list").innerHTML=a.length?a.map(p=>`
<button class="item ${p.id===activeId?"active":""}" data-id="${esc(p.id)}">
<b>${esc(p.name)}</b>
<small>${p.categories.map(esc).join(" · ")||"Chưa phân loại"}</small>
</button>
`).join(""):'<div class="empty">Không tìm thấy protocol phù hợp.</div>';

$("list").querySelectorAll("[data-id]").forEach(b=>{
b.onclick=()=>select(b.dataset.id);
});

$("total").textContent=data.length+" protocol";
}

function render(){
renderFolders();
renderList();
}

function showWelcome(){
editingId=null;
$("detailActions").hidden=true;
$("heading").textContent=folder==="Tất cả"?"Kho protocol":folder;
$("body").innerHTML=`
<div class="welcome">
<div>
<div class="emoji">📋</div>
<h2>Chưa có protocol được chọn</h2>
<p>Chọn protocol ở danh sách bên trái hoặc nhập protocol mới.</p>
</div>
</div>`;
}

function select(id){
let p=data.find(x=>x.id===id);
if(!p)return;

activeId=id;
editingId=null;
renderList();

$("heading").textContent="Chi tiết protocol";
$("detailActions").hidden=false;

$("body").innerHTML=`
<h1 class="detailtitle">${esc(p.name)}</h1>
<div class="meta">
${p.categories.map(c=>`<span class="tag">${esc(c)}</span>`).join("")||'<span class="tag">Chưa phân loại</span>'}
</div>
<div class="content">${esc(p.content)||"Chưa có nội dung protocol."}</div>
${p.notes?`
<div class="section">
<h3>GHI CHÚ</h3>
<div class="content">${esc(p.notes)}</div>
</div>`:""}
${p.images.length?`
<div class="section">
<h3>HÌNH ẢNH ĐÍNH KÈM (${p.images.length}/4)</h3>
<div class="detailimgs">
${p.images.map((src,i)=>`
<img src="${src}" data-image="${i}" alt="Ảnh ${i+1}">
`).join("")}
</div>
</div>`:""}
<div class="section" style="color:#8796a5;font-size:11px">
Cập nhật: ${new Date(p.updatedAt).toLocaleString("vi-VN")}
</div>
`;

$("body").querySelectorAll("[data-image]").forEach((im,i)=>{
im.onclick=()=>openImage(p.images[i]);
});
}

function openImage(src){
$("lightboxImg").src=src;
$("lightbox").classList.add("show");
}

$("closeLightbox").onclick=()=>$("lightbox").classList.remove("show");

$("lightbox").onclick=e=>{
if(e.target===$("lightbox"))$("lightbox").classList.remove("show");
};

function openForm(p=null){
editingId=p?.id??null;
images=p?[...p.images]:[];
$("heading").textContent=p?"Chỉnh sửa protocol":"Nhập protocol mới";
$("detailActions").hidden=true;
renderForm(p);
}

function renderForm(p=null){
$("body").innerHTML=`
<form class="form" id="protocolForm">
<div class="field">
<label>Tên phẫu thuật, thủ thuật <span class="req">*</span></label>
<input id="pname" required maxlength="180"
placeholder="Nhập tên phẫu thuật, thủ thuật..."
value="${esc(p?.name||"")}">
</div>

<div class="field">
<label>Phân loại protocol <span class="req">*</span></label>
<div class="dropdown" id="categoryDrop">
<button type="button" class="dropbtn" id="dropToggle">
<span id="dropLabel">Chọn một hoặc nhiều nhóm phân loại</span>
<span>⌄</span>
</button>
<div class="dropmenu">
${CATS.map(c=>`
<label class="option">
<input type="checkbox" value="${esc(c)}" class="catcheck"
${p?.categories.includes(c)?"checked":""}>
${esc(c)}
</label>
`).join("")}
</div>
</div>
<div class="tags" id="selectedTags"></div>
</div>

<div class="field">
<label>Nội dung protocol <span class="req">*</span></label>
<textarea id="pcontent" required placeholder="Nhập nội dung protocol...">${esc(p?.content||"")}</textarea>
</div>

<div class="field">
<label>Ghi chú</label>
<textarea class="notes" id="pnotes" placeholder="Nhập ghi chú nếu có...">${esc(p?.notes||"")}</textarea>
</div>

<div class="field">
<label>Hình ảnh đính kèm <span style="color:#8796a5;font-weight:400">(tối đa 4 ảnh)</span></label>
<div class="upload" id="upload">
<div style="font-size:26px">🖼️</div>
<p>Tải ảnh từ máy tính hoặc dán ảnh bằng <b>Ctrl + V</b>.</p>
<p>Hỗ trợ tối đa 4 ảnh cho mỗi protocol.</p>
<button type="button" class="btn" id="choose">＋ Chọn ảnh từ máy tính</button>
<input type="file" id="imageFiles" accept="image/*" multiple hidden>
</div>
<div class="foot" style="border:0;padding:8px 0" id="imageCount"></div>
<div class="thumbs" id="thumbs"></div>
</div>

<div class="formfoot">
<button type="button" class="btn" id="cancelForm">Hủy</button>
<button type="submit" class="btn primary">✓ Lưu protocol</button>
</div>
</form>
`;

const dd=$("categoryDrop");
$("dropToggle").onclick=()=>dd.classList.toggle("open");

dd.querySelectorAll(".catcheck").forEach(ch=>{
ch.onchange=updateTags;
});

updateTags();
renderImages();

$("choose").onclick=()=>$("imageFiles").click();

$("imageFiles").onchange=e=>{
addFiles([...e.target.files]);
};

$("cancelForm").onclick=()=>{
if(activeId)select(activeId);
else showWelcome();
};

const up=$("upload");

up.ondragover=e=>{
e.preventDefault();
up.classList.add("drag");
};

up.ondragleave=()=>up.classList.remove("drag");

up.ondrop=e=>{
e.preventDefault();
up.classList.remove("drag");
addFiles([...e.dataTransfer.files]);
};

$("protocolForm").onsubmit=e=>{
e.preventDefault();

let name=$("pname").value.trim();
let cats=[...document.querySelectorAll(".catcheck:checked")].map(x=>x.value);
let content=$("pcontent").value.trim();

if(!name||!cats.length||!content){
toast("Vui lòng nhập tên, chọn phân loại và điền nội dung protocol.");
return;
}

let old=data.find(x=>x.id===editingId);

let obj={
id:old?.id||uid(),
name,
categories:cats,
content,
notes:$("pnotes").value.trim(),
images:[...images],
createdAt:old?.createdAt||Date.now(),
updatedAt:Date.now()
};

let next=old?data.map(x=>x.id===old.id?obj:x):[obj,...data];
let before=data;
data=next;

if(!save()){
data=before;
return;
}

activeId=obj.id;
folder="Tất cả";
render();
select(obj.id);
toast(old?"Đã cập nhật protocol.":"Đã lưu protocol.");
};
}

function updateTags(){
let cats=[...document.querySelectorAll(".catcheck:checked")].map(x=>x.value);

$("dropLabel").textContent=cats.length
?cats.join(", ")
:"Chọn một hoặc nhiều nhóm phân loại";

$("selectedTags").innerHTML=cats.map(c=>
`<span class="tag">${esc(c)}</span>`
).join("");
}

function renderImages(){
$("imageCount").textContent=`Đã chọn ${images.length}/4 ảnh.`;

$("thumbs").innerHTML=images.map((src,i)=>`
<div class="thumb">
<img src="${src}" alt="Ảnh ${i+1}">
<button type="button" data-remove="${i}">×</button>
</div>
`).join("");

$("thumbs").querySelectorAll("[data-remove]").forEach(b=>{
b.onclick=()=>{
images.splice(Number(b.dataset.remove),1);
renderImages();
};
});
}

function addFiles(files){
let fs=files.filter(f=>f.type.startsWith("image/"));
if(!fs.length)return;

let room=4-images.length;

if(room<=0){
toast("Mỗi protocol chỉ được tối đa 4 ảnh.");
return;
}

if(fs.length>room){
toast("Chỉ thêm được "+room+" ảnh nữa (tối đa 4 ảnh).");
}

fs.slice(0,room).forEach(file=>{
let r=new FileReader();

r.onload=()=>{
images.push(r.result);
renderImages();
};

r.readAsDataURL(file);
});
}

document.addEventListener("paste",e=>{
if($("protocolForm")){
let items=[...(e.clipboardData?.items||[])];

let files=items
.filter(i=>i.type.startsWith("image/"))
.map(i=>i.getAsFile())
.filter(Boolean);

if(files.length){
e.preventDefault();
addFiles(files);
}
}
});

$("new").onclick=()=>openForm();

$("search").oninput=renderList;

$("edit").onclick=()=>{
let p=data.find(x=>x.id===activeId);
if(p)openForm(p);
};

$("copy").onclick=()=>{
let p=data.find(x=>x.id===activeId);
if(!p)return;

let clone={
...p,
id:uid(),
name:p.name+" (Bản sao)",
images:[...p.images],
createdAt:Date.now(),
updatedAt:Date.now()
};

data.unshift(clone);

if(save()){
folder="Tất cả";
render();
select(clone.id);
toast("Đã sao chép protocol.");
}
};

function ask(title,message,fn){
$("modalTitle").textContent=title;
$("modalText").textContent=message;
modalAction=fn;
$("modal").classList.add("show");
}

$("delete").onclick=()=>ask(
"Xóa protocol",
"Bạn có chắc chắn muốn xóa protocol này? Thao tác này không thể hoàn tác.",
()=>{
data=data.filter(x=>x.id!==activeId);
activeId=null;
save();
render();
showWelcome();
toast("Đã xóa protocol.");
}
);

$("cancelModal").onclick=()=>{
$("modal").classList.remove("show");
};

$("confirmModal").onclick=()=>{
$("modal").classList.remove("show");
if(modalAction)modalAction();
modalAction=null;
};

$("export").onclick=()=>{
let blob=new Blob(
[JSON.stringify({
version:1,
exportedAt:new Date().toISOString(),
protocols:data
},null,2)],
{type:"application/json"}
);

let url=URL.createObjectURL(blob);
let a=document.createElement("a");

a.href=url;
a.download="cong-cu-y-khoa-backup.json";
a.click();

URL.revokeObjectURL(url);
toast("Đã xuất dữ liệu sao lưu.");
};

$("import").onclick=()=>$("importFile").click();

$("importFile").onchange=e=>{
let f=e.target.files[0];
if(!f)return;

let r=new FileReader();

r.onload=()=>{
try{
let obj=JSON.parse(r.result);
let arr=Array.isArray(obj)?obj:(obj.protocols||obj.dataList);

if(!Array.isArray(arr))throw Error();

let incoming=arr.map(normalize).filter(x=>x&&x.name);
let map=new Map(data.map(x=>[x.id,x]));

incoming.forEach(x=>map.set(x.id,x));
data=[...map.values()];

if(save()){
render();
showWelcome();
toast("Đã nhập "+incoming.length+" protocol.");
}

}catch(err){
toast("File dữ liệu không đúng định dạng.");
}
};

r.readAsText(f);
e.target.value="";
};

load();
render();
showWelcome();

})();
</script>
</body>
</html>
